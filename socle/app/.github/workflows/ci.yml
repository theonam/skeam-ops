# Contrôles à chaque envoi sur GitHub : lint, types, tests unitaires, tests sur base réelle,
# compilation, tests de bout en bout, audit des dépendances et construction de l'image Docker.
# Origine : egm-app `.github/workflows/ci.yml`. Actif dans le dépôt d'une application client, à la racine.
name: Contrôles

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: app
          POSTGRES_PASSWORD: app
          POSTGRES_DB: app
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U app" --health-interval 2s --health-timeout 5s --health-retries 30
    env:
      DATABASE_URL: postgres://app:app@localhost:5432/app
      DATABASE_URL_TEST: postgres://app:app@localhost:5432/postgres
      DEMO_PASSWORD: ci-demo-password
      APP_EDITION: demo
      STORAGE_DRIVER: local
      CI: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - run: pnpm audit --prod --audit-level high
      - run: pnpm check
      - run: pnpm build
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      - name: Captures et traces en cas d'échec
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-resultats
          path: |
            test-results/
            e2e/screenshots/
          retention-days: 7

  docker:
    name: Image Docker
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: application:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
