# Service local de développement : PostgreSQL. Origine : egm-app `docker-compose.yml`.
# Les fichiers sont stockés sur le disque en local, STORAGE_DRIVER=local ; en démo et en production,
# dans le stockage compatible S3 de l'hébergeur.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: app
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app"]
      interval: 2s
      retries: 30
  # Application complète dans son conteneur, image de production : docker compose --profile app up --build
  app:
    profiles: ["app"]
    build: .
    environment:
      DATABASE_URL: postgres://app:app@postgres:5432/app
      DEMO_PASSWORD: ${DEMO_PASSWORD:-change-me-please}
      APP_EDITION: demo
      SEED_DEMO: "1"
      STORAGE_DRIVER: local
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
volumes:
  pgdata:
