<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hors connexion</title>
<style>
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; font-family: system-ui, "Segoe UI", Roboto, sans-serif; background: #f8fafc; color: #0f172a; }
  main { max-width: 22rem; padding: 1.5rem; text-align: center; }
  h1 { font-size: 1.25rem; }
  button { font: inherit; padding: .75rem 1.25rem; border: 0; border-radius: .5rem; background: #1f3a5f; color: #fff; }
</style>
</head>
<body>
<main>
  <h1>Pas de connexion internet</h1>
  <p>L'application a besoin du réseau pour afficher vos données. Rien n'est perdu : réessayez dès que le réseau revient.</p>
  <button onclick="location.reload()">Réessayer</button>
</main>
</body>
</html>
