<!--
Gabarit du dashboard SKEAM, chantier dashboard. Page autonome : dashboard/scripts/rendre.py remplace
le contenu null de script#donnees par la vue JSON d'agreger.py et, en vue interne, celui de script#todoist
par la configuration Todoist et l'instantané pris à la génération. Format : dashboard/README.md.
Publiée en artefact avec la capacité mcp sur Todoist, la page lit la todo en direct et coche les tâches.
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+Condensed:wght@500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Mise en page : bandeau, puis todo, alertes et devis à envoyer, chiffres clés, portefeuille, charge, détail par projet ; une colonne sur téléphone. */
:root {
  --fond: #f3f5f8;
  --surface: #ffffff;
  --encre: #18212c;
  --discret: #5a6676;
  --trait: #d9dfe7;
  --accent: #1d5a86;
  --accent-doux: #e3edf5;
  --critique: #b42318;
  --critique-doux: #fdecea;
  --attention: #a15c07;
  --attention-doux: #fdf3e2;
  --ok: #1e7a46;
  --ok-doux: #e5f4ea;
  --piste: #e6eaf0;
  --agents: #8fb3cf;
  --etape-ia: #5b8fb8;
  --etape-dev: #a9c7de;
  --etape-cours: #d6e3ee;
  --f-titre: "IBM Plex Sans Condensed", "Arial Narrow", "Roboto Condensed", system-ui, sans-serif;
  --f-texte: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --f-donnee: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
  --rayon: 8px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --fond: #11161c; --surface: #19202a; --encre: #e4e9f0; --discret: #97a3b3; --trait: #2a3340;
    --accent: #79b4e0; --accent-doux: #1b2d3d; --critique: #f2877b; --critique-doux: #3a1d1b;
    --attention: #e8b25c; --attention-doux: #33281a; --ok: #6cc893; --ok-doux: #17301f;
    --piste: #26303c; --agents: #3f6a8c; --etape-ia: #4f86b2; --etape-dev: #2e5170; --etape-cours: #253645;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --fond: #11161c; --surface: #19202a; --encre: #e4e9f0; --discret: #97a3b3; --trait: #2a3340;
  --accent: #79b4e0; --accent-doux: #1b2d3d; --critique: #f2877b; --critique-doux: #3a1d1b;
  --attention: #e8b25c; --attention-doux: #33281a; --ok: #6cc893; --ok-doux: #17301f;
  --piste: #26303c; --agents: #3f6a8c; --etape-ia: #4f86b2; --etape-dev: #2e5170; --etape-cours: #253645;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  margin: 0; background: var(--fond); color: var(--encre);
  font: 15px/1.5 var(--f-texte);
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 20px 48px;
}
main { max-width: 1120px; margin: 0 auto; display: flex; flex-direction: column; gap: 28px; }
h1, h2, h3 { font-family: var(--f-titre); font-weight: 600; text-wrap: balance; margin: 0; line-height: 1.2; }
h1 { font-size: 1.6rem; }
h2 { font-size: 1.15rem; letter-spacing: .01em; }
h3 { font-size: 1rem; }
a { color: var(--accent); }
a:focus-visible, summary:focus-visible, button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 4px; }
button { font: inherit; color: inherit; }
.num, .id { font-family: var(--f-donnee); font-variant-numeric: tabular-nums; }
.id { font-size: .82em; color: var(--discret); white-space: nowrap; }
.discret { color: var(--discret); }
.manquant { color: var(--attention); font-style: italic; }
.etiquette { font-family: var(--f-titre); font-size: .72rem; text-transform: uppercase; letter-spacing: .08em; color: var(--discret); font-weight: 500; }
section { display: flex; flex-direction: column; gap: 12px; min-width: 0; }
.entete-section { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; flex-wrap: wrap; }

/* Bandeau */
.bandeau { display: flex; justify-content: space-between; align-items: flex-end; gap: 12px 24px; flex-wrap: wrap; border-bottom: 2px solid var(--encre); padding-bottom: 12px; }
.bandeau .meta { display: flex; gap: 6px 16px; flex-wrap: wrap; font-size: .85rem; color: var(--discret); }
.audience { display: inline-block; font-family: var(--f-titre); font-size: .75rem; text-transform: uppercase; letter-spacing: .08em; padding: 2px 8px; border-radius: 4px; background: var(--accent-doux); color: var(--accent); font-weight: 600; vertical-align: middle; margin-left: 8px; }

/* Chiffres clés */
.chiffres { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 1px; background: var(--trait); border: 1px solid var(--trait); border-radius: var(--rayon); overflow: hidden; }
.chiffre { background: var(--surface); padding: 12px 14px; display: flex; flex-direction: column; gap: 2px; }
@media (max-width: 560px) { .chiffres { grid-template-columns: 1fr 1fr; } .chiffre:last-child:nth-child(odd) { grid-column: span 2; } }
.chiffre .valeur { font-family: var(--f-donnee); font-size: 1.3rem; font-weight: 500; font-variant-numeric: tabular-nums; }
.chiffre .note { font-size: .78rem; }

/* À traiter */
.traiter { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 420px), 1fr)); gap: 16px; align-items: start; }
.colonne { display: flex; flex-direction: column; gap: 16px; min-width: 0; }
.liste { list-style: none; margin: 0; padding: 0; background: var(--surface); border: 1px solid var(--trait); border-radius: var(--rayon); }
.liste > li { padding: 10px 14px 10px 16px; border-top: 1px solid var(--trait); display: flex; flex-direction: column; gap: 2px; position: relative; min-width: 0; }
.liste > li:first-child { border-top: 0; }
.liste > li::before { content: ""; position: absolute; left: 0; top: 8px; bottom: 8px; width: 3px; border-radius: 2px; background: var(--trait); }
.liste > li.haute::before, .liste > li.retard::before { background: var(--critique); }
.liste > li.moyenne::before { background: var(--attention); }
.liste > li.basse::before { background: var(--discret); }
.liste .ligne1 { display: flex; gap: 8px; align-items: baseline; flex-wrap: wrap; }
.liste .vide { color: var(--discret); }
.liste .vide::before { display: none; }
.projet-nom { font-family: var(--f-titre); font-weight: 600; font-size: .85rem; }

/* Todo Todoist */
.todo .groupe { padding: 8px 14px 4px; font-family: var(--f-titre); font-weight: 600; font-size: .85rem; border-top: 1px solid var(--trait); background: var(--fond); }
.todo .groupe:first-child { border-top: 0; border-radius: var(--rayon) var(--rayon) 0 0; }
.todo .groupe::before { display: none; }
.todo .tache { flex-direction: row; align-items: flex-start; gap: 10px; }
.cocher { flex: none; width: 22px; height: 22px; margin-top: 1px; border: 2px solid var(--discret); border-radius: 50%; background: transparent; cursor: pointer; padding: 0; }
.cocher.p1 { border-color: var(--critique); }
.cocher.p2 { border-color: var(--attention); }
.cocher:hover { background: var(--accent-doux); }
.cocher:disabled { opacity: .5; cursor: progress; }
.tache .texte { display: flex; flex-direction: column; gap: 2px; min-width: 0; overflow-wrap: anywhere; }
.tache .erreur { color: var(--critique); font-size: .82rem; }
.etat-source { font-size: .8rem; color: var(--discret); }
.bouton { border: 1px solid var(--trait); background: var(--surface); border-radius: 6px; padding: 4px 10px; cursor: pointer; font-size: .85rem; }
.bouton:hover { border-color: var(--accent); }

/* Compteurs */
.compteurs { background: var(--surface); border: 1px solid var(--trait); border-radius: var(--rayon); }
.compteurs-projet { padding: 10px 14px; border-top: 1px solid var(--trait); display: flex; flex-wrap: wrap; gap: 8px 10px; align-items: baseline; }
.compteurs-projet:first-child { border-top: 0; }
.compteurs-projet .projet-nom { flex: 0 0 100%; }
details.compteur { flex: 1 1 100%; }
details.compteur > summary { display: inline-flex; cursor: pointer; list-style: none; }
details.compteur > summary::-webkit-details-marker { display: none; }
details.compteur ul { margin: 6px 0 2px; padding-left: 1.1em; font-size: .88rem; display: flex; flex-direction: column; gap: 3px; max-height: 18rem; overflow-y: auto; }
.rangee-compteurs { display: flex; flex-wrap: wrap; gap: 8px; flex: 0 0 100%; }
.rangee-compteurs details.compteur { flex: 0 1 auto; }
.rangee-compteurs details.compteur[open] { flex: 1 1 100%; }

/* Pastilles */
.pastille { display: inline-block; font-size: .72rem; line-height: 1.5; padding: 0 7px; border-radius: 999px; white-space: nowrap; font-weight: 500; background: var(--piste); color: var(--discret); }
details.compteur > summary .pastille { font-size: .8rem; padding: 1px 9px; }
details.compteur > summary .pastille::after { content: " ▾"; }
details.compteur[open] > summary .pastille::after { content: " ▴"; }
.p-critique { background: var(--critique-doux); color: var(--critique); }
.p-attention { background: var(--attention-doux); color: var(--attention); }
.p-ok { background: var(--ok-doux); color: var(--ok); }
.p-accent { background: var(--accent-doux); color: var(--accent); }

/* Portefeuille */
.defilant { overflow-x: auto; background: var(--surface); border: 1px solid var(--trait); border-radius: var(--rayon); }
table { border-collapse: collapse; width: 100%; min-width: 34rem; font-size: .9rem; }
th { text-align: left; font-family: var(--f-titre); font-weight: 500; font-size: .72rem; text-transform: uppercase; letter-spacing: .07em; color: var(--discret); padding: 10px 12px; border-bottom: 1px solid var(--trait); white-space: nowrap; }
td { padding: 10px 12px; border-top: 1px solid var(--trait); vertical-align: top; }
tr:first-child td { border-top: 0; }
td.droite, th.droite { text-align: right; }
.portefeuille td:first-child a { font-weight: 600; text-decoration: none; color: var(--encre); }
.portefeuille td:first-child a:hover { text-decoration: underline; }
.lots-mini { display: flex; flex-direction: column; gap: 4px; min-width: 190px; }
.lots-mini .jauge { grid-template-columns: 3.2em 1fr 6.4em; white-space: nowrap; }
.groupe-lot td { background: var(--fond); padding-block: 10px 8px; }
.groupe-lot .titre-lot { font-family: var(--f-titre); font-weight: 600; font-size: .98rem; color: var(--encre); }
.groupe-lot .but-lot { display: block; font-size: .82rem; color: var(--discret); max-width: 90ch; margin-top: 2px; }
.lot-etapes .titre-lot { font-family: var(--f-titre); font-weight: 600; display: block; margin-bottom: 4px; }

/* Jauges */
.jauge { display: grid; grid-template-columns: 3.2em 1fr 4.6em; align-items: center; gap: 8px; font-size: .8rem; }
.piste { height: 6px; background: var(--piste); border-radius: 3px; position: relative; overflow: visible; }
.piste > span { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 3px; background: var(--accent); }
.piste.temps > span { background: var(--agents); }
.piste.temps.depasse > span { background: var(--critique); }
.piste .repere { position: absolute; top: -3px; bottom: -3px; width: 2px; background: var(--encre); opacity: .55; border-radius: 1px; }
.etapes { display: flex; height: 8px; background: var(--piste); border-radius: 4px; overflow: hidden; }
.etapes span { display: block; height: 100%; }
.etapes .ia { background: var(--etape-ia); }
.etapes .dev { background: var(--etape-dev); }
.etapes .cours, i.cours { background: repeating-linear-gradient(135deg, var(--etape-dev) 0 2px, var(--etape-cours) 2px 5px); }
.lot-etapes .chiffres-etapes .pct { color: var(--discret); margin-left: 6px; }
.lot-etapes { display: grid; grid-template-columns: 4.2em 1fr; gap: 6px 12px; align-items: start; font-size: .85rem; padding-block: 6px; border-top: 1px solid var(--trait); }
.lot-etapes:first-child { border-top: 0; }
.lot-etapes .chiffres-etapes { display: flex; flex-wrap: wrap; gap: 4px 16px; margin-top: 6px; }
.lot-etapes .chiffres-etapes i { display: inline-block; width: 9px; height: 9px; border-radius: 2px; margin-right: 5px; vertical-align: 0; }
.lot-etapes .heures { margin-top: 6px; display: grid; grid-template-columns: auto 1fr; gap: 4px 8px; align-items: baseline; }
.lot-etapes .heures .piste { grid-column: 1 / -1; grid-row: 2; }
.lot-etapes .libelle-heures { font-size: .8125rem; font-weight: 600; }
.devis-carte { padding: 10px 0; border-bottom: 1px solid var(--trait); }
.devis-carte:last-child { border-bottom: 0; }
.devis-tete { display: flex; flex-wrap: wrap; gap: 4px 10px; align-items: baseline; }
.devis-tete .objet { font-weight: 600; flex: 1 1 14rem; min-width: 0; }
.devis-paiement { display: flex; flex-wrap: wrap; gap: 4px 6px; margin-top: 4px; }
.devis-partie { display: grid; grid-template-columns: 3.5rem 1fr; gap: 2px 10px; margin-top: 8px; }
.devis-partie .ligne-partie { display: flex; flex-wrap: wrap; gap: 4px 8px; align-items: baseline; font-size: .875rem; }
.etape-suivante { font-size: .875rem; font-weight: 600; }
.facturables { list-style: disc; margin: 6px 0 0; padding-left: 1.1rem; }
.facturables li { padding: 4px 0; font-size: .9rem; }
.facturables li span:first-child { margin-right: 10px; }
.facturables .prix { white-space: nowrap; float: right; }
.etapes .dev-seul { background: var(--etape-ia); }
.fonctions-lot { margin-top: 10px; }
.liste-fonctions { list-style: none; margin: 4px 0 0; padding: 0; }
.liste-fonctions li { display: flex; justify-content: space-between; gap: 10px; padding: 6px 0; border-bottom: 1px solid var(--trait); font-size: .875rem; }
details.bloc > summary { cursor: pointer; min-height: 44px; display: list-item; padding-top: 12px; }
.fonctions { margin: 4px 0 0; padding-left: 1.1rem; font-size: .875rem; }
.fonctions li { margin: 2px 0; }
.desc-lot { display: block; font-size: .8125rem; margin: 2px 0 4px; }

/* Charge */
.charge { background: var(--surface); border: 1px solid var(--trait); border-radius: var(--rayon); padding: 14px; display: flex; flex-direction: column; gap: 10px; }
.barre-charge { display: grid; grid-template-columns: minmax(90px, 160px) 1fr 9em; gap: 10px; align-items: center; font-size: .88rem; }
.barre-charge .pile { display: flex; height: 14px; background: var(--piste); border-radius: 3px; overflow: hidden; }
.barre-charge .theo { background: var(--accent); }
.barre-charge .agents { background: var(--agents); }
.legende { display: flex; gap: 16px; flex-wrap: wrap; font-size: .78rem; color: var(--discret); }
.note-budget { font-size: .8rem; color: var(--discret); }
.ligne-conso { display: grid; grid-template-columns: minmax(90px, 160px) 1fr; gap: 10px; align-items: baseline; font-size: .88rem; }
.agents-lot { margin-top: 4px; font-size: .8125rem; }
.agents-item { font-size: .78rem; white-space: nowrap; }
.legende i { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 5px; vertical-align: -1px; }

/* Détail */
details.projet { background: var(--surface); border: 1px solid var(--trait); border-radius: var(--rayon); }
details.projet > summary { cursor: pointer; list-style: none; padding: 14px 16px; display: flex; gap: 8px 14px; align-items: baseline; flex-wrap: wrap; }
details.projet > summary::-webkit-details-marker { display: none; }
details.projet > summary::before { content: "▸"; color: var(--discret); transition: transform .15s; display: inline-block; }
details.projet[open] > summary::before { transform: rotate(90deg); }
details.projet > summary h3 { font-size: 1.1rem; }
.corps-projet { padding: 4px 16px 18px; display: flex; flex-direction: column; gap: 18px; border-top: 1px solid var(--trait); }
.grille-infos { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 12px 20px; padding-top: 14px; }
.grille-infos div { display: flex; flex-direction: column; gap: 2px; min-width: 0; overflow-wrap: anywhere; }
.blocs { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 300px), 1fr)); gap: 16px; }
.bloc { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.bloc ul { margin: 0; padding-left: 1.1em; display: flex; flex-direction: column; gap: 4px; font-size: .9rem; }
.synthese { border-left: 3px solid var(--accent); padding: 4px 0 4px 12px; font-size: .92rem; max-width: 70ch; }
.vide-page { background: var(--surface); border: 1px dashed var(--trait); border-radius: var(--rayon); padding: 24px; color: var(--discret); }
@media (max-width: 560px) {
  body { font-size: 14px; }
  h1 { font-size: 1.35rem; }
  .barre-charge { grid-template-columns: 1fr 9em; }
  .barre-charge .nom { grid-column: 1 / -1; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>

<main id="app"><p class="vide-page">Chargement du tableau de bord.</p></main>

<script id="donnees" type="application/json">null</script>
<script id="todoist" type="application/json">null</script>
<script>
(function () {
  "use strict";
  var app = document.getElementById("app");
  function lireJson(id) { try { return JSON.parse(document.getElementById(id).textContent); } catch (e) { return null; } }
  var D = lireJson("donnees");
  var TD = lireJson("todoist");
  if (!D || !D.projets) {
    app.innerHTML = '<p class="vide-page">Aucune donnée intégrée. Produire la page avec <code>python dashboard/scripts/rendre.py dashboard/out/&lt;audience&gt;.json --sortie dashboard/out/&lt;audience&gt;.html</code>.</p>';
    return;
  }

  var STATUTS = { prospect: "Prospect", cadrage: "Cadrage", devis_envoye: "Devis envoyé", signe: "Signé", en_dev: "En développement", recette: "Recette", run: "Run", clos: "Clos" };
  var STATUTS_ITEM = { a_faire: "À faire", en_cours: "En cours", a_recetter: "À recetter", fait: "Fait", abandonne: "Abandonné" };
  var CLASSE_ITEM = { a_faire: "", en_cours: "p-accent", a_recetter: "p-attention", fait: "p-ok", abandonne: "" };
  var APPORTEURS = { theo: "Théo", jonathan: "Jonathan", autre: "Autre" };
  var DEVIS = { brouillon: "brouillon", envoye: "envoyé", accepte: "accepté", refuse: "refusé" };
  var TYPES_ALERTE = { depassement_lot: "Dépassement", depassement_item: "Dépassement", bloque_externe: "Bloqué", en_cours_ancien: "Enlisé", registre_desynchronise: "Registre", conso_tarif_manquant: "Tarif", conso_sessions_sans_releve: "Relevé" };
  var LIENS = { demo: "Démo", prod: "Production", docs_client: "Docs client", docs_commercial: "Docs commercial", docs_interne: "Docs interne" };
  var NON_JOURNALISE = '<span class="manquant">temps non journalisé</span>';
  var DEVIS_NON_SAISI = '<span class="manquant">devis non saisi</span>';
  var interne = D.audience === "interne";
  var client = D.audience === "client";
  // Vue commerciale minimaliste : facturation, avancement, satisfaction du client, ce qui peut se vendre.
  var commercial = D.audience === "commercial";

  function esc(v) {
    return String(v == null ? "" : v).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }
  var fmtEuro = new Intl.NumberFormat("fr-FR", { style: "currency", currency: "EUR", maximumFractionDigits: 0 });
  var fmtNombre = new Intl.NumberFormat("fr-FR", { maximumFractionDigits: 2 });
  function euro(v) { return '<span class="num">' + esc(fmtEuro.format(v || 0)) + "</span>"; }
  function h(v) { return '<span class="num">' + esc(fmtNombre.format(v || 0)) + " h</span>"; }
  var fmtUsd = new Intl.NumberFormat("fr-FR", { style: "currency", currency: "USD", currencyDisplay: "narrowSymbol", maximumFractionDigits: 2 });
  /** Coût des agents au tarif de l'API, en dollars ; inconnu si un modèle n'a pas de tarif. */
  function usd(v) { return v == null ? '<span class="manquant">coût inconnu</span>' : '<span class="num">' + esc(fmtUsd.format(v)) + "</span>"; }
  /** Ligne courte des agents : temps machine, durée réelle et coût ; jamais ajoutée au temps passé. */
  function agentsCourt(c) { return c ? "Agents · " + h(c.heures_machine) + " machine · " + h(c.heures_reelles) + " réelles · " + usd(c.cout_usd) : ""; }
  function date(iso) {
    if (!iso) return "";
    var p = iso.slice(0, 10).split("-");
    return p[2] + "/" + p[1] + "/" + p[0];
  }
  function pastille(texte, classe) { return '<span class="pastille ' + (classe || "") + '">' + esc(texte) + "</span>"; }
  function statutProjet(s) { return pastille(STATUTS[s] || s, s === "en_dev" || s === "recette" ? "p-accent" : s === "run" ? "p-ok" : ""); }
  function statutItem(s) { return pastille(STATUTS_ITEM[s] || s, CLASSE_ITEM[s]); }
  function ancre(slug) { return "projet-" + String(slug).replace(/[^a-z0-9]/g, ""); }

    return "Lecture directe de Todoist impossible.";
  }
  var RETIRER = { needs_reauth: 1, server_not_connected: 1, selection_required: 1, not_in_manifest: 1, approval_required: 1, blocked_by_policy: 1, consent_required: 1 };
  function surveiller(outil, entree, cle) {
    return mcp.watchTool(CFG.connecteur, outil, entree, function (ev) {
      if (ev.type === "data") {
        besoinAccord = false;
        var charge = ev.result && ev.result.payload;
        if (cle === "sections") direct.sections = (charge && charge.sections) || [];
        else { direct.taches = (charge && charge.tasks) || []; direct.partiel = !!(charge && charge.hasMore); }
        direct.recuLe = ev.result.cache ? ev.result.cache.storedAt : Date.now();
        messageDirect = "";
      } else {
        messageDirect = messageErreur(ev.error);
        if (ev.error && ev.error.code === "approval_required") besoinAccord = true;
        if (RETIRER[ev.error && ev.error.code]) { direct.sections = null; direct.taches = null; }
      }
      afficherTodo();
    }, { refetchInterval: 60000 });
  }
  function cocher(id) {
    enCours[id] = true;
    delete erreurs[id];
    afficherTodo();
    mcp.callTool(CFG.connecteur, "complete-tasks", { ids: [id] }).then(function () {
      enCours["fait-" + id] = true;
      delete enCours[id];
      afficherTodo();
      mcp.invalidate(CFG.connecteur, "find-tasks").catch(function () {});
    }, function (err) {
      delete enCours[id];
      var code = err && err.code;
      erreurs[id] = code === "server_unavailable" || code === "upstream_error" || code === "cancelled"
        ? "Résultat incertain : vérifier dans Todoist avant de recocher."
        : code === "tool_error" ? "Todoist a refusé : " + (err.message || "erreur") : messageErreur(err);
      afficherTodo();
    });
  }
  function autoriser() {
    besoinAccord = false;
    messageDirect = "";
    afficherTodo();
    Promise.all([
      mcp.callTool(CFG.connecteur, "find-sections", { projectId: CFG.projet_id }),
      mcp.callTool(CFG.connecteur, "find-tasks", { projectId: CFG.projet_id, limit: 100 }),
    ]).then(function (res) {
      direct.sections = (res[0].payload && res[0].payload.sections) || [];
      direct.taches = (res[1].payload && res[1].payload.tasks) || [];
      direct.partiel = !!(res[1].payload && res[1].payload.hasMore);
      direct.recuLe = Date.now();
      afficherTodo();
    }, function (err) {
      messageDirect = messageErreur(err);
      if (err && err.code === "approval_required") besoinAccord = true;
      afficherTodo();
    });
  }
  etat.addEventListener("click", function (ev) {
    if (ev.target && ev.target.id === "todo-autoriser") autoriser();
  });
  liste.addEventListener("click", function (ev) {
    var bouton = ev.target.closest && ev.target.closest("[data-tache]");
    if (bouton && !bouton.disabled) cocher(bouton.getAttribute("data-tache"));
  });
  afficherTodo();
  if (CFG && window.claude && typeof window.claude.use === "function") {
    window.claude.use("mcp").then(function (ns) {
      if (!ns) return;
      mcp = ns;
      surveiller("find-sections", { projectId: CFG.projet_id }, "sections");
      surveiller("find-tasks", { projectId: CFG.projet_id, limit: 100 }, "taches");
    }, function () {});
  }
})();
</script>
