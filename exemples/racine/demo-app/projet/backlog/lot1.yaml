items:
  - id: DEMO-003
    titre: Saisie du pointage journalier par compagnon
    module: pointage
    lot: 1
    priorite: indispensable
    statut: en_cours
    taille: M
    estimation_h: 6
    dependances:
      - DEMO-001
      - DEMO-002
      - "externe: liste des compagnons fournie par le client"
    criteres_acceptation:
      - Un compagnon saisit ses heures du jour en moins de 30 secondes sur téléphone.
      - Une journée au-delà de 10 heures est refusée, conformément à RG2.
      - Le pointage d'un jour passé n'est plus modifiable par le compagnon, conformément à RG3.
    audience: client
    a_valider: false
    commit: null
    maj: 2026-10-15
