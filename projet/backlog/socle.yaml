    estimation_h: 4
    dependances:
      - OPS-111
    criteres_acceptation:
      - Des onglets apparaissent en tête de la liste des factures.
      - L'onglet Brouillons montre les factures de statut brouillon.
      - L'onglet Attente de paiement montre les factures émises non payées, y compris en retard, avec leur nombre affiché sur l'onglet.
