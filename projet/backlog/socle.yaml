    criteres_acceptation:
      - Les jetons de la direction artistique Ardoise et cuivre sont repris dans le socle, avec ardoise, sable, cuivre limité au logo et au menu, et rouge vif réservé aux pastilles de notification.
      - Le logo contour fin, hexagone filaire et point cuivre, et les icônes d'installation sont repris.
      - Les tableaux sont zébrés avec un en-tête ardoise.
      - Les cases à cocher sont sobres, contour gris et ardoise pleine une fois cochées.
      - Les champs de saisie sont carrés, et les boutons, panneaux et totaux sont arrondis.
      - Les boutons principaux sont en ardoise.
      - La pastille de statut commune reprend les trois couleurs, vert pour fait, gris ardoise pour travail, rouge pour événement, et turquoise pour à facturer.
      - L'illustration d'en-tête « technicien connecté » est reprise.
      - Chaque point est vérifié par des captures aux quatre largeurs.
