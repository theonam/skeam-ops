# Tarifs SKEAM. Format : CONTRAT.md section 8.2. Audience interne uniquement.
# Valeurs proposées le 2026-10-15, arrêtées et modifiables par Théo.
# Après modification, relancer calibrer.py --recalculer pour mettre à jour prix_conseille_ht.
taux_horaire_cible: 70
# Fraction ajoutée aux heures probables d'un item selon sa taille : 0.2 signifie plus 20 %.
# Croît avec la taille : plus un item est gros, plus l'incertitude et la recette pèsent.
marge_securite:
  XS: 0.1
  S: 0.15
  M: 0.2
  L: 0.3
  XL: 0.4
# Montant HT minimal d'un chiffrage complet : couvre cadrage, devis et mise en route.
plancher_ht: 1500
