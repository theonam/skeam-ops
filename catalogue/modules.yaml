# Catalogue des modules SKEAM. Format : CONTRAT.md section 8.1. Audience interne.
# Graine du 2026-10-15 : heures estimées, confiance faible, à calibrer par calibrer.py.
# Justification module par module : catalogue/HYPOTHESES.md.
# heures_min et heures_max couvrent la mise en œuvre complète du module chez un client,
# développement assisté par IA et recette comprise, une fois par projet.
# mesures est réécrit par calibrer.py ; ne pas l'éditer à la main.
